# Perfil "prod" (despliegue con Docker / nube). Se activa con SPRING_PROFILES_ACTIVE=prod.
# Todo lo sensible llega por variables de entorno; no hay valores por defecto para los secretos.

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

# Sin trazas SQL en produccion
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# "update" crea/ajusta tablas solas; es aceptable para el curso. Con datos reales se usarian migraciones (Flyway).
spring.jpa.hibernate.ddl-auto=update

# JWT: SIN valor por defecto. Si JWT_SECRET falta (o es corta) la aplicacion no debe arrancar.
app.jwt.secret=${JWT_SECRET}

# CORS: con el proxy de nginx no se usa, pero se puede abrir un origen concreto (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost}

# Contrasenas de los usuarios iniciales (admin y barista), obligatorias en prod
app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.barista-password=${SEED_BARISTA_PASSWORD}

# Swagger apagado por defecto en produccion; SWAGGER_ENABLED=true para una demo
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
