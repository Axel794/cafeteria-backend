spring.application.name=cafeteria-backend
server.port=8080

# --- Conexion a base de datos (perfil por defecto: H2 en archivo, sin instalar nada) ---
spring.datasource.url=jdbc:h2:file:./data/cafeteria
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console (sirve como evidencia de conexion)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Seguridad (Spring Security + JWT) ---
# En produccion definir la variable de entorno JWT_SECRET (minimo 32 caracteres). Este valor es solo para desarrollo.
app.jwt.secret=${JWT_SECRET:clave-secreta-de-desarrollo-cafeteria-como-dice-el-dicho-2026}
app.jwt.expiration-minutes=120

# --- CORS: origenes permitidos del frontend Angular (separados por coma) ---
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# --- Usuarios de prueba que se crean al primer arranque (cambiar fuera de desarrollo) ---
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin123*}
app.seed.barista-password=${SEED_BARISTA_PASSWORD:Barista123*}

# --- Documentacion de la API (springdoc-openapi): http://localhost:8080/swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Eficiencia (PC6 / ODS 9): menos bytes por respuesta y menos consultas ---
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
# Carga los detalles de varios pedidos con 1 consulta IN (...) en lugar de 1 por pedido (evita N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=20
