spring.application.name=cafeteria-backend
server.port=8080

# --- Conexion a base de datos (perfil por defecto: H2 en archivo, sin instalar nada) ---
spring.datasource.url=jdbc:h2:file:./data/cafeteria
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: http://localhost:8080/h2-console (sirve como evidencia de conexion)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
